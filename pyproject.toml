[project]
name = "cac-cot"
version = "0.1.0"
description = "CAC-CoT: Connector-Aware Chain-of-Thought"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "tqdm",
    "pyyaml",
    "python-dotenv",
    "openai",
    "google-generativeai",
    "datasets",
    "transformers",
    "vllm",
    "matplotlib"  # Derived from previous project context if needed, or just safe to include
]

[tool.setuptools.package-dir]
"" = "."
"src" = "src"

[build-system]
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"
